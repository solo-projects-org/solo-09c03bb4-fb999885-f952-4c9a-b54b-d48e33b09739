<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}分流核验{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">分期分流核验</a>
  <nav>
    <a href="{{ url_for('index') }}">总览</a>
    <a href="{{ url_for('plan') }}">计划设置</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
        {% for category, message in messages %}
          <li class="flash {{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>
  <span>本期规则：最多 {{ MAX_PERIODS }} 期、合计 {{ TOTAL_USERS }} 人；每人全程只计一次。</span>
</footer>
</body>
</html>
